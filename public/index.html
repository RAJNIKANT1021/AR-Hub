<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b141a" />
    <meta name="description" content="AR Hub — a modern real-time messenger: chats, group rooms, voice & video calls, status stories, voice notes and multiplayer games." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AR Hub" />
    <meta property="og:title" content="AR Hub — Chat, Rooms & Calls" />
    <meta property="og:description" content="Real-time chat, rooms, calls, stories and games. Built with React + Firebase + WebRTC." />
    <link rel="icon" href="%PUBLIC_URL%/icon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint (no flash)
      try {
        var t = localStorage.getItem('arhub-theme') || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        var a = localStorage.getItem('arhub-accent');
        if (a) document.documentElement.style.setProperty('--accent', a);
      } catch (e) {}
    </script>
    <title>AR Hub</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run AR Hub.</noscript>
    <div id="root"></div>
  </body>
</html>
